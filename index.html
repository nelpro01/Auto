<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toyota IST - AutoMarket</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f3f4f6;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      padding: 20px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      font-size: 25px;
    }

    header h1 span {
      color: #25D366;
    }

    .hero {
      background: linear-gradient(135deg, #111827, #374151);
      color: white;
      text-align: center;
      padding: 65px 20px;
    }

    .hero h2 {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .hero p {
      color: #d1d5db;
      font-size: 18px;
    }

    .container {
      max-width: 1050px;
      margin: 45px auto;
      padding: 0 20px;
    }

    .car-card {
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .car-image {
      min-height: 450px;
      background: #e5e7eb;
    }

    .car-image img {
      width: 100%;
      height: 100%;
      min-height: 450px;
      object-fit: cover;
    }

    .car-info {
      padding: 40px;
    }

    .car-info h2 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    .available {
      color: #16a34a;
      font-weight: bold;
      margin-top: 10px;
    }

    .price {
      font-size: 32px;
      font-weight: bold;
      color: #16a34a;
      margin: 22px 0;
    }

    .details {
      margin-bottom: 25px;
    }

    .detail {
      display: flex;
      justify-content: space-between;
      padding: 15px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .detail strong {
      color: #111827;
    }

    .contact-title {
      margin-top: 25px;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .phone {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 18px;
    }

    .whatsapp {
      display: block;
      text-align: center;
      background: #25D366;
      color: white;
      text-decoration: none;
      padding: 16px;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      transition: 0.2s;
    }

    .whatsapp:hover {
      background: #1ebe5d;
      transform: translateY(-2px);
    }

    footer {
      margin-top: 60px;
      background: #111827;
      color: #9ca3af;
      text-align: center;
      padding: 30px;
    }

    @media (max-width: 750px) {
      .car-card {
        grid-template-columns: 1fr;
      }

      .hero h2 {
        font-size: 30px;
      }

      .car-image,
      .car-image img {
        min-height: 280px;
      }

      .car-info {
        padding: 25px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Auto<span>Market</span></h1>
    <div>Véhicules disponibles</div>
  </header>

  <section class="hero">
    <h2>Trouvez votre prochaine voiture</h2>
    <p>Une voiture qui vous correspond</p>
  </section>

  <main class="container">

    <div class="car-card">

      <div class="car-image">
        <img
          src="https://images.unsplash.com/photo-1550355291-bbee04a92027?auto=format&fit=crop&w=1000&q=80"
          alt="Toyota IST blanche">
      </div>

      <div class="car-info">

        <h2>Toyota IST</h2>

        <p class="available">● Disponible</p>

        <div class="price">
          3 700 $
        </div>

        <div class="details">

          <div class="detail">
            <span>Transmission</span>
            <strong>Automatique</strong>
          </div>

          <div class="detail">
            <span>Carburant</span>
            <strong>Essence</strong>
          </div>

          <div class="detail">
            <span>Couleur</span>
            <strong>Blanche</strong>
          </div>

        </div>

        <div class="contact-title">
          📞 Contactez-nous
        </div>

        <div class="phone">
          0841300783
        </div>

        <a
          class="whatsapp"
          href="https://wa.me/243841300783?text=Bonjour%2C%20je%20suis%20int%C3%A9ress%C3%A9%20par%20la%20Toyota%20IST%20%C3%A0%203700%20%24."
          target="_blank">
          💬 Contacter sur WhatsApp
        </a>

      </div>

    </div>

  </main>

  <footer>
    © 2026 AutoMarket — Vente automobile
  </footer>

</body>
</html>
